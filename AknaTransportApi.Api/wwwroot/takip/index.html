<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>AKNA Transport · Canlı Takip</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="takip.css">
</head>
<body>
  <header class="bar">
    <strong>AKNA Transport</strong>
    <span>Canlı Takip</span>
  </header>
  <main>
    <div id="map" class="map" aria-label="Araç konumu haritası"></div>
    <section class="card" aria-live="polite">
      <div class="row">
        <span id="status" class="badge">Yükleniyor…</span>
        <span id="updated" class="muted"></span>
      </div>
      <h1 id="title">Takip bilgisi alınıyor</h1>
      <p id="message" class="muted"></p>
      <dl id="details" hidden>
        <dt>Tarih</dt><dd id="date"></dd>
        <dt id="plate-label" hidden>Araç plakası</dt><dd id="plate" class="plate" hidden></dd>
        <dt>Teslimat adresi</dt><dd id="address"></dd>
      </dl>
      <a id="open-maps" class="button" target="_blank" rel="noopener" hidden>Haritada aç</a>
    </section>
  </main>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="takip.js"></script>
</body>
</html>
